name: Genie
options:
  bundleIdPrefix: com.nicholasdudek
  deploymentTarget:
    iOS: "17.0"
packages:
  AgentRuntime:
    path: ../AgentRuntime
targets:
  Genie:
    type: application
    platform: iOS
    sources:
      - path: Sources/GenieMobile
    dependencies:
      - package: AgentRuntime
        product: GenieAgentCore
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Genie
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Genie connects to local AI model runtimes (Ollama) and developer servers on your local Wi-Fi network."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nicholasdudek.genie.mobile
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
