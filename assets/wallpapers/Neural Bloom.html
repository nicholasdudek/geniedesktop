<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neural Bloom</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #050510;
      overflow: hidden;
      cursor: crosshair;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    }

    canvas {
      display: block;
      position: fixed;
      top: 0; left: 0;
    }

    .hud {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.35);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 10;
    }

    .title {
      position: fixed;
      top: 2rem;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.6);
      font-size: 1rem;
      font-weight: 300;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="title">Neural Bloom</div>
  <div class="hud">move to attract · click to burst</div>
  <canvas id="c"></canvas>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

const mouse = { x: W / 2, y: H / 2, active: false };
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true; });
window.addEventListener('mouseleave', () => { mouse.active = false; });

class Particle {
  constructor(x, y, angle, speed, hue) {
    this.x = x;
    this.y = y;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.hue = hue;
    this.life = 1.0;
    this.decay = 0.002 + Math.random() * 0.004;
    this.size = 1.5 + Math.random() * 3;
    this.trail = [];
    this.maxTrail = 12 + Math.floor(Math.random() * 18);
    this.gravity = (Math.random() - 0.5) * 0.02;
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 0.02 + Math.random() * 0.04;
  }

  update() {
    this.trail.push({ x: this.x, y: this.y });
    if (this.trail.length > this.maxTrail) this.trail.shift();

    // Mouse attraction
    if (mouse.active) {
      const dx = mouse.x - this.x;
      const dy = mouse.y - this.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 300 && dist > 10) {
        const force = 80 / (dist * dist) * 50;
        this.vx += (dx / dist) * force;
        this.vy += (dy / dist) * force;
      }
    }

    // Organic wobble
    this.wobble += this.wobbleSpeed;
    this.vx += Math.sin(this.wobble) * 0.03;
    this.vy += Math.cos(this.wobble * 0.7) * 0.03 + this.gravity;

    // Damping
    this.vx *= 0.985;
    this.vy *= 0.985;

    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;
  }

  draw() {
    if (this.life <= 0) return;

    // Trail
    if (this.trail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(this.trail[0].x, this.trail[0].y);
      for (let i = 1; i < this.trail.length; i++) {
        ctx.lineTo(this.trail[i].x, this.trail[i].y);
      }
      const alpha = this.life * 0.3;
      ctx.strokeStyle = `hsla(${this.hue}, 80%, 65%, ${alpha})`;
      ctx.lineWidth = this.size * 0.4;
      ctx.stroke();
    }

    // Glow
    const glowSize = this.size * 3 * this.life;
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glowSize);
    grad.addColorStop(0, `hsla(${this.hue}, 90%, 75%, ${this.life * 0.8})`);
    grad.addColorStop(1, `hsla(${this.hue}, 90%, 50%, 0)`);
    ctx.beginPath();
    ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // Core
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(${this.hue}, 100%, 90%, ${this.life})`;
    ctx.fill();
  }
}

let particles = [];
let baseHue = 240;
let frame = 0;

function spawnBurst(x, y, count, spread) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * spread;
    const hue = baseHue + (Math.random() - 0.5) * 60;
    particles.push(new Particle(x, y, angle, speed, hue));
  }
}

// Initial bloom
spawnBurst(W / 2, H / 2, 120, 4);

window.addEventListener('click', e => {
  spawnBurst(e.clientX, e.clientY, 60, 5);
});

// Continuous gentle emission from center
function ambientEmit() {
  if (frame % 3 === 0) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 0.5 + Math.random() * 1.5;
    const hue = baseHue + (Math.random() - 0.5) * 40;
    particles.push(new Particle(W / 2, H / 2, angle, speed, hue));
  }
}

// ── ⚡ Bioluminescent Electric Lightning Arc Effects ──
window.lightningEnabled = true;

function drawLightning(x1, y1, x2, y2, hue) {
  const segments = 6;
  let curX = x1;
  let curY = y1;
  const dx = (x2 - x1) / segments;
  const dy = (y2 - y1) / segments;

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(curX, curY);
  for (let i = 1; i < segments; i++) {
    const jitterX = (Math.random() - 0.5) * 24;
    const jitterY = (Math.random() - 0.5) * 24;
    curX = x1 + dx * i + jitterX;
    curY = y1 + dy * i + jitterY;
    ctx.lineTo(curX, curY);
  }
  ctx.lineTo(x2, y2);

  // Outer glow
  ctx.strokeStyle = `hsla(${hue}, 100%, 75%, 0.8)`;
  ctx.lineWidth = 2.0;
  ctx.shadowColor = `hsla(${hue}, 100%, 65%, 1.0)`;
  ctx.shadowBlur = 12;
  ctx.stroke();

  // White core
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.95)';
  ctx.lineWidth = 0.8;
  ctx.shadowBlur = 0;
  ctx.stroke();
  ctx.restore();
}

window.onWindowDrag = function(dx, dy) {
  mouse.active = true;
  mouse.x = Math.max(20, Math.min(W - 20, mouse.x + dx * 0.7));
  mouse.y = Math.max(20, Math.min(H - 20, mouse.y + dy * 0.7));
  if (Math.hypot(dx, dy) > 1.5) {
    spawnBurst(mouse.x, mouse.y, 4, 3.5);
  }
};

function animate() {
  frame++;
  baseHue = (baseHue + 0.15) % 360;

  // Fade background
  ctx.fillStyle = 'rgba(5, 5, 16, 0.12)';
  ctx.fillRect(0, 0, W, H);

  ambientEmit();

  // Update & draw
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw();
    if (particles[i].life <= 0) {
      particles.splice(i, 1);
    }
  }

  // Draw lightning arcs between cursor/window focal point and nearby particles
  if (window.lightningEnabled && mouse.active) {
    let connected = 0;
    for (let i = 0; i < particles.length && connected < 5; i++) {
      const p = particles[i];
      const dx = p.x - mouse.x;
      const dy = p.y - mouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 240 && Math.random() < 0.35) {
        drawLightning(mouse.x, mouse.y, p.x, p.y, p.hue);
        connected++;
      }
    }
  }

  // Cap particle count for performance
  if (particles.length > 2000) {
    particles.splice(0, particles.length - 2000);
  }

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
