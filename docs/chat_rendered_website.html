<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Genie Spatial Neural Console</title>
<style>
  :root {
    --bg-gradient: radial-gradient(circle at 50% 20%, #1a1a2e 0%, #0f0f1b 100%);
    --card-bg: rgba(255, 255, 255, 0.06);
    --border-color: rgba(255, 255, 255, 0.15);
    --accent-cyan: #00f2fe;
    --accent-purple: #4facfe;
    --text-primary: #ffffff;
    --text-muted: rgba(255, 255, 255, 0.65);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif; }
  body {
    background: var(--bg-gradient);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow: hidden;
  }
  .glass-card {
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-color);
    border-radius: 20px;
    padding: 24px;
    width: 100%;
    max-width: 580px;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 30px rgba(0, 242, 254, 0.15);
    text-align: center;
    position: relative;
    z-index: 10;
  }
  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    background: linear-gradient(135deg, rgba(0, 242, 254, 0.2), rgba(79, 172, 254, 0.2));
    border: 1px solid var(--accent-cyan);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent-cyan);
    margin-bottom: 12px;
  }
  h1 {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #ffffff 0%, #a1c4fd 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  p.subtitle {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 20px;
  }
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .metric-box {
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    padding: 12px;
  }
  .metric-value {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent-cyan);
  }
  .metric-label {
    font-size: 10px;
    color: var(--text-muted);
    text-transform: uppercase;
    margin-top: 2px;
  }
  .btn-cluster {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  button {
    padding: 10px 18px;
    border-radius: 12px;
    border: none;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .btn-primary {
    background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
    color: #000;
    box-shadow: 0 4px 15px rgba(0, 242, 254, 0.35);
  }
  .btn-primary:active { transform: scale(0.96); }
  .btn-secondary {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  .btn-secondary:active { transform: scale(0.96); }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="particleCanvas"></canvas>

<div class="glass-card">
  <div class="badge">⚡️ Atomic Copy-Paste Render</div>
  <h1>Genie Spatial Neural Console</h1>
  <p class="subtitle">Full website rendered instantaneously inside chat with zero typewriter lag.</p>

  <div class="metrics-grid">
    <div class="metric-box">
      <div class="metric-value" id="fpsDisplay">120 Hz</div>
      <div class="metric-label">ProMotion</div>
    </div>
    <div class="metric-box">
      <div class="metric-value" id="renderLatency">0.02 ms</div>
      <div class="metric-label">Paste Latency</div>
    </div>
    <div class="metric-box">
      <div class="metric-value" id="particlesCount">64</div>
      <div class="metric-label">Live Particles</div>
    </div>
  </div>

  <div class="btn-cluster">
    <button class="btn-primary" onclick="pulseUniverse()">🌌 Pulse Universe</button>
    <button class="btn-secondary" onclick="toggleTheme()">✨ Switch Glow</button>
  </div>
</div>

<script>
  const canvas = document.getElementById('particleCanvas');
  const ctx = canvas.getContext('2d');
  let width, height;
  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const particles = [];
  for (let i = 0; i < 64; i++) {
    particles.push({
      x: Math.random() * width,
      y: Math.random() * height,
      vx: (Math.random() - 0.5) * 1.5,
      vy: (Math.random() - 0.5) * 1.5,
      radius: Math.random() * 2 + 1
    });
  }

  let glowColor = 'rgba(0, 242, 254, ';
  function draw() {
    ctx.clearRect(0, 0, width, height);
    for (let i = 0; i < particles.length; i++) {
      let p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0 || p.x > width) p.vx *= -1;
      if (p.y < 0 || p.y > height) p.vy *= -1;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = glowColor + '0.8)';
      ctx.fill();

      for (let j = i + 1; j < particles.length; j++) {
        let p2 = particles[j];
        let dist = Math.hypot(p.x - p2.x, p.y - p2.y);
        if (dist < 90) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = glowColor + (1 - dist / 90) * 0.25 + ')';
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();

  function pulseUniverse() {
    particles.forEach(p => {
      p.vx = (Math.random() - 0.5) * 8;
      p.vy = (Math.random() - 0.5) * 8;
    });
    setTimeout(() => {
      particles.forEach(p => {
        p.vx = (Math.random() - 0.5) * 1.5;
        p.vy = (Math.random() - 0.5) * 1.5;
      });
    }, 600);
  }

  function toggleTheme() {
    glowColor = glowColor.includes('242') ? 'rgba(255, 75, 145, ' : 'rgba(0, 242, 254, ';
  }
</script>
</body>
</html>
